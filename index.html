<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./styles.css" />
    <script type="module" src="./index.js"></script>
    <title>Buttleship</title>
  </head>
  <body>
    <main class="main">
      <div class="heading">
      <h1>Buttleship</h1>
      <button class="heading__button start__button">Начать игру</button>
      <button class="heading__button finish__button" disabled>Закончить игру</button>
      <button class="heading__button save__button" >Сохранить игру</button>
      </div>
      <div class="game-status"></div>
      <div class="battleship__container">
        <section class="ships__container">
          <h2>Корабли</h2>
        </section>
        <section class="player">
          <h2>Игрок</h2>
          <div class="container player__container">
            <div class="numbers"></div>
            <div class="field__content">
              <div class="words"></div>
              <div class="field player__field"></div>
            </div>
          </div>
        </section>
        <div class="battleship__container">
          <section class="computer">
            <h2>Компьютер</h2>
            <div class="container computer__container">
              <div class="numbers"></div>
              <div class="field__content">
                <div class="words"></div>
                <div class="field computer__field"></div>
              </div>
            </div>
          </section>
        </div>
      </div>
    </main>
  </body>
</html>
